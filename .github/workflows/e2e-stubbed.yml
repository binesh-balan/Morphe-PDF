name: Playwright E2E (stubbed)

# Reusable workflow called from build.yml. Backend-free Playwright suite —
# fast, no Spring Boot required. Runs against the `stubbed` project which
# mocks API responses in the browser. Fans out one job per browser
# (chromium/firefox/webkit) so all three run in parallel on their own runner.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  playwright-e2e:
    name: playwright-e2e (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      # One browser breaking must not mask a failure in another - report all.
      fail-fast: false
      matrix:
        include:
          - label: chromium
            browser: chromium
            project: stubbed
          - label: firefox
            browser: firefox
            project: stubbed-firefox
          - label: webkit
            browser: webkit
            project: stubbed-webkit
          # Morphe-PDF: guards the HttpOnly-cookie auth transport (P0 #3), which
          # is otherwise never exercised - the flag is off by default, so the
          # three legs above all run bearer mode. The flag is read at BUILD time
          # (vite inlines import.meta.env), which is why it belongs on the build
          # step and not the test step.
          #
          # Chromium only, deliberately: this leg guards an auth transport, not
          # an engine. Adding it to firefox/webkit would triple the cost to
          # re-test the same code path. Revisit if a cookie bug ever turns out
          # to be engine-specific.
          - label: chromium-cookie-auth
            browser: chromium
            project: stubbed
            cookieMode: "true"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Install Playwright (${{ matrix.browser }})
        run: task e2e:install -- ${{ matrix.browser }}
      - name: Build frontend (production bundle for vite preview)
        env:
          VITE_BUILD_FOR_PREVIEW: "1"
          # Empty on the default legs, which leaves bearer mode on.
          VITE_AUTH_COOKIE_MODE: ${{ matrix.cookieMode }}
        run: task frontend:build
      - name: Run stubbed E2E tests (${{ matrix.label }})
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/frontend/playwright-report/results.json
        run: task e2e:stubbed-project PROJECT=${{ matrix.project }} -- --workers=3
      - name: Flag flaky tests
        # Runs regardless of the test outcome: a flaky test (passed on retry)
        # leaves the step green, so this is the only place it surfaces. Emits
        # ::warning:: annotations + a job summary; never fails the job.
        if: always()
        working-directory: frontend
        run: npx tsx editor/scripts/report-flaky-tests.mts "$PLAYWRIGHT_JSON_OUTPUT_FILE"
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/frontend/playwright-report/results.json
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-stubbed-${{ matrix.label }}-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7
